<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viết bình luận</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .star-rating {
            direction: rtl;
            display: inline-flex;
            gap: 5px;
            font-size: 30px;
            cursor: pointer;
        }
        .star-rating input {
            display: none;
        }
        .star-rating label {
            color: #ccc;
            cursor: pointer;
        }
        .star-rating input:checked ~ label {
            color: #ffc107;
        }
        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: #ffc107;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <h2 class="mb-4">Viết bình luận cho {{ restaurant.name }}</h2>

                <form method="POST" class="card p-4">
                    {% csrf_token %}

                    <!-- Rating -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Đánh giá sao:</label>

                        <div class="star-rating">
                            <input type="radio" id="star5" name="stars" value="5" required>
                            <label for="star5" title="5 sao">★</label>

                            <input type="radio" id="star4" name="stars" value="4">
                            <label for="star4" title="4 sao">★</label>

                            <input type="radio" id="star3" name="stars" value="3">
                            <label for="star3" title="3 sao">★</label>

                            <input type="radio" id="star2" name="stars" value="2">
                            <label for="star2" title="2 sao">★</label>

                            <input type="radio" id="star1" name="stars" value="1">
                            <label for="star1" title="1 sao">★</label>
                        </div>
                    </div>

                    <!-- Comment -->
                    <div class="form-group mb-3">
                        <label for="comment" class="form-label">Bình luận:</label>
                        <textarea name="comment" id="comment" class="form-control" rows="5" 
                                  placeholder="Nhập bình luận của bạn..." required></textarea>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i> Gửi bình luận
                        </button>

                        <a href="{% url 'food:restaurant_detail' restaurant.id %}" 
                           class="btn btn-secondary">
                            Hủy
                        </a>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
