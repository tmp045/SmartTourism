{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viết bình luận - {{ dish.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h2>Viết bình luận</h2>
        <p class="text-muted">Món ăn: <strong>{{ dish.name }}</strong></p>
        
        <form method="POST" class="card p-4">
          {% csrf_token %}
          
          <div class="form-group mb-3">
            <label for="stars" class="form-label">Đánh giá sao:</label>
            <select name="stars" id="stars" class="form-select" required>
              <option value="">-- Chọn số sao --</option>
              <option value="1">⭐ 1 sao</option>
              <option value="2">⭐⭐ 2 sao</option>
              <option value="3">⭐⭐⭐ 3 sao</option>
              <option value="4">⭐⭐⭐⭐ 4 sao</option>
              <option value="5">⭐⭐⭐⭐⭐ 5 sao</option>
            </select>
          </div>
          
          <div class="form-group mb-3">
            <label for="comment" class="form-label">Bình luận:</label>
            <textarea name="comment" id="comment" class="form-control" rows="5" placeholder="Nhập bình luận của bạn..." required></textarea>
          </div>
          
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-paper-plane"></i> Gửi bình luận
            </button>
            <a href="{% url 'cooperate:cooperate_dish_detail' dish.id %}" class="btn btn-secondary">Hủy</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
