{% extends "food/base.html" %}
{% load static %}

{% block content %}

<div class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center">
    <div class="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full text-center">
        
        <h2 class="text-xl font-semibold mb-3">Bạn có chắc muốn đăng xuất?</h2>
        <p class="text-gray-600 mb-6">Hành động này sẽ đăng xuất bạn khỏi tài khoản hiện tại.</p>

        <div class="flex justify-center gap-4">
            <form method="post" action="{% url 'account_logout' %}">
                {% csrf_token %}
                <button 
                    class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">
                    Đăng xuất
                </button>
            </form>

            <a href="{% url 'food:home' %}"
               class="bg-gray-300 px-4 py-2 rounded-lg hover:bg-gray-400">
                Hủy
            </a>
        </div>

    </div>
</div>

{% endblock %}
